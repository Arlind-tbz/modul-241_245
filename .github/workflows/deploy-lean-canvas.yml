name: Deploy lean-canvas to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lean-canvas/**'
      - '.github/workflows/deploy-lean-canvas.yml'

jobs:
  trigger-deploy:
    name: Trigger Cloudflare Pages Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: |
          curl -X POST "${{ secrets.CF_PAGES_WEBHOOK_LEAN_CANVAS }}"
