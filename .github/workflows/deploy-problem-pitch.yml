name: Deploy problem-pitch to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'problem-pitch/**'
      - '.github/workflows/deploy-problem-pitch.yml'

jobs:
  trigger-deploy:
    name: Trigger Cloudflare Pages Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: |
          curl -X POST "${{ secrets.CF_PAGES_WEBHOOK_PROBLEM_PITCH }}"
